name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - "BLOG.md"
      - "website/**"
      - "figures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site builder
        run: python3 -m pip install --upgrade pip markdown

      - name: Assemble static site
        run: |
          mkdir -p _site/figures _site/assets
          python3 website/build_site.py --blog BLOG.md --output _site/index.html
          cp website/styles.css _site/styles.css
          if [ -f website/assets/og.png ]; then cp website/assets/og.png _site/assets/og.png; fi
          cp figures/blog_teaser.png \
             figures/online_sdft_process.gif \
             figures/bandit_accuracy.png \
             figures/bandit_learning_curves.png \
             _site/figures/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
